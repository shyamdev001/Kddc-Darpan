name: Production stack check

# Builds the production images and starts the whole stack (database, API, dashboard, Caddy) the way
# the server does, then checks it from outside through HTTPS, as a browser and a TV would.
on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - ".dockerignore"
      - "package-lock.json"
      - "apps/api/prisma/**"
      - "apps/api/src/config-check.ts"
      - ".github/workflows/deploy-check.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "apps/*/Dockerfile"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v5

      - name: Settings for a throwaway server (random secrets, deleted at the end)
        run: |
          db=$(openssl rand -hex 24); jwt=$(openssl rand -hex 32); admin=$(openssl rand -hex 16)
          echo "::add-mask::$db"; echo "::add-mask::$jwt"; echo "::add-mask::$admin"
          cat > .env <<EOF
          DARPAN_DOMAIN=localhost
          POSTGRES_PASSWORD=$db
          PUBLIC_BASE_URL=https://localhost
          WEB_ORIGIN=https://localhost
          JWT_SECRET=$jwt
          TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)
          REQUIRE_2FA=off
          SEED_ADMIN_EMAIL=ci-admin@example.com
          SEED_ADMIN_PASSWORD=$admin
          MAIL_DRIVER=console
          EOF

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health through HTTPS
        run: curl -fsSk https://localhost/api/health | tee /dev/stderr | grep -q '"db":"ok"'

      - name: Dashboard sign-in page, with security headers
        run: |
          curl -fsSk -D headers.txt -o /dev/null https://localhost/login
          grep -qi '^strict-transport-security:' headers.txt
          ! grep -qi '^server:' headers.txt
          ! grep -qi '^x-powered-by:' headers.txt
          # No other site may frame the dashboard (click-jacking), on any page, signed in or not.
          for page in /login / /broadcast; do
            curl -sSk -D h.txt -o /dev/null "https://localhost$page"
            grep -i "^content-security-policy:.*frame-ancestors 'none'" h.txt || { echo "::error::$page lacks frame-ancestors"; cat h.txt; exit 1; }
            grep -qi '^x-frame-options: *deny' h.txt
            grep -qi '^x-content-type-options: *nosniff' h.txt
            grep -qi '^referrer-policy:' h.txt
          done

      - name: Video tools present in the API image
        run: docker compose exec -T api sh -c 'ffmpeg -version | head -1 && ffprobe -version | head -1'

      - name: A TV can register and use its token
        run: |
          reply=$(curl -fsSk -X POST https://localhost/api/devices/register \
            -H 'content-type: application/json' \
            -d '{"hardwareId":"ci-stack-check-tv","model":"CI TV","osVersion":"11","resolution":"1920x1080","appVersion":"0.0.0"}')
          token=$(echo "$reply" | jq -r .deviceToken)
          code=$(echo "$reply" | jq -r .pairingCode)
          [ -n "$token" ] && [ "$token" != null ] && [[ "$code" =~ ^[0-9]{6}$ ]]
          curl -fsSk -o /dev/null -H "authorization: Bearer $token" https://localhost/api/devices/status
          echo "$token" > ../tv-token.txt

      - name: Backup runs, and a restore drill gets the same data back
        run: |
          # As the user the API runs as: uploads must be able to write here.
          docker compose exec -T -u node api sh -c 'echo probe > /data/media/ci-probe.txt'
          # The API itself runs as "node", not root.
          docker compose exec -T api sh -c 'for p in /proc/[0-9]*; do tr "\000" " " < $p/cmdline 2>/dev/null | grep -q "^node dist/main.js" && stat -c %U $p; done' | grep -qx node
          docker compose exec -T backup sh /scripts/backup.sh
          ls -l backups/db/darpan-*.dump
          test -f backups/media/ci-probe.txt
          test -f backups/last-success
          out=$(docker compose exec -T backup sh /scripts/restore.sh)
          echo "$out"
          live=$(docker compose exec -T db psql -U darpan -d darpan_prod -tAc 'SELECT count(*) FROM "Screen"')
          echo "$out" | grep -q "Screens in darpan_restore_test: $live\$"
          [ "$live" -ge 1 ]
          # The live database cannot be overwritten by accident.
          ! docker compose exec -T backup sh /scripts/restore.sh "" darpan_prod
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backup)")" = healthy ]

      - name: Live connections pass through Caddy (TVs and dashboard)
        run: |
          curl -fsSk 'https://localhost/socket.io/?EIO=4&transport=polling' | grep -q '"sid"'
          curl -fsSk 'https://localhost/api/realtime?EIO=4&transport=polling' | grep -q '"sid"'

      - name: First admin is created and can sign in
        run: |
          docker compose exec -T api npx prisma db seed
          set -a; . ./.env; set +a
          status=$(curl -sSk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$SEED_ADMIN_EMAIL\",\"password\":\"$SEED_ADMIN_PASSWORD\"}")
          echo "login status $status"
          [ "$status" = 200 ] || [ "$status" = 201 ]

      - name: Data survives restarting every service
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 180
          curl -fsSk -o /dev/null -H "authorization: Bearer $(cat ../tv-token.txt)" https://localhost/api/devices/status

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Clean up
        if: always()
        run: docker compose down -v
